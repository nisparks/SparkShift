# ------------------------------------------------------------------------------
# 7. Master Toolchange Orchestrator (_SPARKSHIFT_CHANGE_TOOL)
# ------------------------------------------------------------------------------
[gcode_macro _SPARKSHIFT_CHANGE_TOOL]
description: Full anti-ooze dropoff, pickup, purge-chute prime, silicone wipe, and PA/offset sync
gcode:
    {% set new_tool = params.TOOL|int %}
    {% set vars = printer["gcode_macro _SPARKSHIFT_VARS"] %}
    {% set old_tool = vars.active_tool|int %}

    {% if new_tool == old_tool %}
        RESPOND PREFIX="SPARKSHIFT" MSG="T{new_tool} is already active."
    {% else %}
        SAVE_GCODE_STATE NAME=SPARKSHIFT_CHANGE_STATE
        G90
        # 0. Clear global G-code offsets before executing mechanical dock coordinates
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

        # Ensure safe Z clearance above the print before entering dock corridor
        {% if printer.toolhead.position.z < vars.min_safe_z %}
            G0 Z{vars.min_safe_z} F9000
        {% else %}
            G91
            G0 Z1.50 F9000
            G90
        {% endif %}

        # 1. Decompress outgoing Volcano melt zone & freeze tip BEFORE opening HGX hobs
        _SPARKSHIFT_PRE_DROP TOOL={old_tool}

        # 2. Park outgoing toolhead on P25's spring-compliant Silicone Ooze Stopper Pad
        _SPARKSHIFT_DROP_TOOL TOOL={old_tool}

        # 3. Pick up incoming toolhead T_new and lock HGX hobs onto filament strand
        _SPARKSHIFT_PICKUP_TOOL TOOL={new_tool}

        # 4. Prime Volcano melt zone over P26 Purge Chute and scrub across Dual Silicone Wipers
        SPARKSHIFT_CLEAN_NOZZLE TOOL={new_tool} PRIME=1

        RESTORE_GCODE_STATE NAME=SPARKSHIFT_CHANGE_STATE MOVE=0

        # 5. Apply per-tool Pressure Advance, Thermal Z-Offset, Retraction, and Input Shaper
        _SPARKSHIFT_APPLY_TOOL_PARAMS TOOL={new_tool}
        SET_GCODE_VARIABLE MACRO=_SPARKSHIFT_VARS VARIABLE=active_tool VALUE={new_tool}
        RESPOND PREFIX="SPARKSHIFT" MSG="Switched T{old_tool} -> T{new_tool} complete."
    {% endif %}

# ------------------------------------------------------------------------------
# 8. Stage 1 — Pre-Drop Anti-Ooze Melt-Zone Decompression
# ------------------------------------------------------------------------------
[gcode_macro _SPARKSHIFT_PRE_DROP]
gcode:
    {% set tool = params.TOOL|int %}
    {% set vars = printer["gcode_macro _SPARKSHIFT_VARS"] %}
    {% set t_macro = printer["gcode_macro T" ~ tool] %}

    {% if printer.extruder.can_extrude %}
        M83
        # Retract filament to decompress the 22 mm Volcano melt zone while HGX hobs still grip
        G1 E-{vars.pre_drop_retract_mm} F{t_macro.retract_spd * 60}
        # Brief 40% CPAP pulse to freeze the retracted meniscus inside the nozzle bore
        SET_FAN_SPEED FAN=cpap_blower SPEED=0.40
        G4 P450
        SET_FAN_SPEED FAN=cpap_blower SPEED=0.0
    {% endif %}

# ------------------------------------------------------------------------------
# 9. Stage 2 — Dock Entry, Silicone Ooze-Pad Sealing & Servo Cam Release
# ------------------------------------------------------------------------------
[gcode_macro _SPARKSHIFT_DROP_TOOL]
gcode:
    {% set tool = params.TOOL|int %}
    {% set vars = printer["gcode_macro _SPARKSHIFT_VARS"] %}
    {% set t_macro = printer["gcode_macro T" ~ tool] %}

    # Rapid to safe approach coordinate in front of Bay T_old
    G0 X{t_macro.dock_x} Y{vars.dock_y_safe} F24000
    G0 Y{vars.dock_y_wipe} F12000

    # Glide onto P25 dock pins and up the 15-deg ramp onto the Silicone Ooze Stopper Pad
    G0 Y{vars.dock_y_latched} F3600
    M400

    # Open P05 Servo Cam (175 deg -> 2.73 mm hob release gap)
    SET_SERVO SERVO=sparkshift_cam ANGLE={vars.servo_open_angle}
    G4 P{vars.servo_dwell_ms}

    # Drop outgoing hotend to non-oozing standby temperature while sealed on silicone pad
    M104 S{t_macro.standby_temp}

    # Withdraw carriage clear of dock and P26 wiper chute
    G0 Y{vars.dock_y_safe} F9000
    M400

# ------------------------------------------------------------------------------
# 10. Stage 3 — Tool Pickup & HGX Hob Filament Re-Engagement
# ------------------------------------------------------------------------------
[gcode_macro _SPARKSHIFT_PICKUP_TOOL]
gcode:
    {% set tool = params.TOOL|int %}
    {% set vars = printer["gcode_macro _SPARKSHIFT_VARS"] %}
    {% set t_macro = printer["gcode_macro T" ~ tool] %}

    # Ensure P05 Servo Cam is open before entering T_new bay
    SET_SERVO SERVO=sparkshift_cam ANGLE={vars.servo_open_angle}
    G0 X{t_macro.dock_x} Y{vars.dock_y_safe} F24000

    # Start heating incoming toolhead to printing temperature
    M104 S{t_macro.print_temp}

    # Enter dock bay and seat Maxwell kinematic couplings
    G0 Y{vars.dock_y_latched} F4500
    M400

    # Close P05 Servo Cam (0 deg) so spring-loaded HGX steel hobs bite T_new's filament
    SET_SERVO SERVO=sparkshift_cam ANGLE={vars.servo_lock_angle}
    G4 P{vars.servo_dwell_ms}
    # Release continuous servo PWM hold to prevent MG90D thermal drift (spring holds hobs closed)
    SET_SERVO SERVO=sparkshift_cam WIDTH=0

    # Wait for hotend to reach printing temperature while nozzle orifice is still sealed on P25 pad
    M109 S{t_macro.print_temp}

    # Execute +0.40 mm hob-tooth seating micro-pulse before unlatching from dock
    M83
    G1 E{vars.pickup_seat_mm} F300
    M400

# ------------------------------------------------------------------------------
# 11. Stage 4 — P26 Purge-Chute Prime & Dual-Blade Silicone Wiper Scrub
# ------------------------------------------------------------------------------
[gcode_macro SPARKSHIFT_CLEAN_NOZZLE]
description: Primes melt zone over P26 Purge Chute and scrubs nozzle across Dual Silicone Wiper Blades
gcode:
    {% set vars = printer["gcode_macro _SPARKSHIFT_VARS"] %}
    {% set tool = params.TOOL|default(vars.active_tool)|int %}
    {% set do_prime = params.PRIME|default(0)|int %}
    {% set t_macro = printer["gcode_macro T" ~ tool] %}
    {% set cx = t_macro.dock_x|float %}
    {% set span = vars.wipe_span_x|float %}

    G90
    {% if do_prime == 1 and printer.extruder.can_extrude %}
        # Step back 6.5 mm from P25 silicone pad to center nozzle over P26 Purge Drop Window
        G0 X{cx} Y{vars.dock_y_prime} F6000
        M83
        # Prime Volcano melt zone into P26 chute and micro-retract to stop dribble
        G1 E{vars.prime_purge_mm} F720
        G1 E-{vars.post_prime_retract} F2400
        # Blast CPAP at 75% to solidify purge pellet for clean shear-off
        SET_FAN_SPEED FAN=cpap_blower SPEED=0.75
        G4 P350
    {% endif %}

    # Pull nozzle through P26 Dual-Blade Silicone Wiper (Y_local = 9.45..11.95 mm)
    G0 X{cx} Y{vars.dock_y_wipe} F9000

    # Perform multi-pass +/-X scrub strokes across V-notched silicone wiper fins
    {% for i in range(vars.wipe_strokes|int) %}
        G0 X{cx - span} Y{vars.dock_y_wipe - 0.8} F10800
        G0 X{cx + span} Y{vars.dock_y_wipe + 0.8} F10800
    {% endfor %}
    G0 X{cx} Y{vars.dock_y_safe} F15000
    SET_FAN_SPEED FAN=cpap_blower SPEED=0.0
    M400

# ------------------------------------------------------------------------------
# 12. Stage 5 — Per-Tool Pressure Advance, Thermal Z-Offset & Input Shaper Sync
# ------------------------------------------------------------------------------
[gcode_macro _SPARKSHIFT_APPLY_TOOL_PARAMS]
gcode:
    {% set tool = params.TOOL|int %}
    {% set vars = printer["gcode_macro _SPARKSHIFT_VARS"] %}
    {% set t_macro = printer["gcode_macro T" ~ tool] %}

    # 1. Restore per-tool Pressure Advance & Smooth Time
    SET_PRESSURE_ADVANCE ADVANCE={t_macro.pa} SMOOTH_TIME={t_macro.pa_smooth}

    # 2. Restore per-tool Firmware Retraction
    SET_RETRACTION RETRACT_LENGTH={t_macro.retract_len} RETRACT_SPEED={t_macro.retract_spd}

    # 3. Restore per-tool Input Shaper frequencies
    SET_INPUT_SHAPER SHAPER_TYPE_X={t_macro.shaper_x} SHAPER_FREQ_X={t_macro.freq_x} SHAPER_TYPE_Y={t_macro.shaper_y} SHAPER_FREQ_Y={t_macro.freq_y}

    # 4. Compute Volcano thermal-expansion Z compensation + static XYZ nozzle offsets
    {% set delta_t = [t_macro.print_temp - 220.0, 0.0]|max %}
    {% set thermal_z = delta_t * vars.thermal_z_coeff %}
    {% set total_z = t_macro.z_offset + thermal_z %}
    SET_GCODE_OFFSET X={t_macro.x_offset} Y={t_macro.y_offset} Z={total_z} MOVE=1

    # 5. Update CPAP blower ceiling for active tool/material
    SET_GCODE_VARIABLE MACRO=_SPARKSHIFT_VARS VARIABLE=cpap_scale VALUE={t_macro.cpap_max}

# ------------------------------------------------------------------------------
# 13. CPAP Blower Slicer Fan Override (M106 / M107)
# ------------------------------------------------------------------------------
[gcode_macro M106]
description: Scales slicer 0-255 fan commands by active toolhead's cpap_max ceiling
gcode:
    {% set s = params.S|default(255)|float %}
    {% set vars = printer["gcode_macro _SPARKSHIFT_VARS"] %}
    {% set speed = (s / 255.0) * (vars.cpap_scale|float) %}
    SET_FAN_SPEED FAN=cpap_blower SPEED={speed}

[gcode_macro M107]
gcode:
    SET_FAN_SPEED FAN=cpap_blower SPEED=0.0

# ------------------------------------------------------------------------------
# 14. Physical Commissioning, Dry-Run Dock Verification & Calibration Macros
# ------------------------------------------------------------------------------
[gcode_macro SPARKSHIFT_TEST_SERVO_CAM]
description: Cycles P05 Servo Cam (0 deg <-> 175 deg) and reports A1104 Hall sensor state
gcode:
    {% set vars = printer["gcode_macro _SPARKSHIFT_VARS"] %}
    RESPOND PREFIX="SPARKSHIFT" MSG="Testing P05 Servo Cam release (175 deg -> 2.73mm hob gap)..."
    SET_SERVO SERVO=sparkshift_cam ANGLE={vars.servo_open_angle}
    G4 P800
    RESPOND PREFIX="SPARKSHIFT" MSG="Testing P05 Servo Cam lock (0 deg -> spring preload engaged)..."
    SET_SERVO SERVO=sparkshift_cam ANGLE={vars.servo_lock_angle}
    G4 P500
    SET_SERVO SERVO=sparkshift_cam WIDTH=0
    RESPOND PREFIX="SPARKSHIFT" MSG="Servo Cam test complete. Hall tool_detected={vars.tool_detected}"

[gcode_macro SPARKSHIFT_VERIFY_DOCK_ALIGNMENT]
description: Low-speed dry-run check of dock approach, P26 wiper path, and P25 latch coordinate
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set vars = printer["gcode_macro _SPARKSHIFT_VARS"] %}
    {% set t_macro = printer["gcode_macro T" ~ tool] %}
    G90
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    {% if printer.toolhead.position.z < vars.min_safe_z %}
        G0 Z{vars.min_safe_z} F6000
    {% endif %}
    RESPOND PREFIX="SPARKSHIFT" MSG="Dry-run approach to T{tool} at X={t_macro.dock_x}..."
    G0 X{t_macro.dock_x} Y{vars.dock_y_safe} F9000
    G4 P1000
    RESPOND PREFIX="SPARKSHIFT" MSG="Moving to P26 Dual Silicone Wiper station (Y={vars.dock_y_wipe})..."
    G0 Y{vars.dock_y_wipe} F1800
    G4 P1500
    RESPOND PREFIX="SPARKSHIFT" MSG="Moving to P26 Purge Chute station (Y={vars.dock_y_prime})..."
    G0 Y{vars.dock_y_prime} F1800
    G4 P1500
    RESPOND PREFIX="SPARKSHIFT" MSG="Gliding to P25 Silicone Ooze Stopper Pad (Y={vars.dock_y_latched})..."
    G0 Y{vars.dock_y_latched} F1200
    G4 P2000
    G0 Y{vars.dock_y_safe} F6000
    RESPOND PREFIX="SPARKSHIFT" MSG="Dry-run verification for T{tool} complete."

[gcode_macro SPARKSHIFT_CALIBRATE_SHAPER_ALL]
description: Runs Beacon/Cartographer ADXL345 input shaper calibration at bed center
gcode:
    G90
    G0 X175 Y175 Z20 F12000
    SHAPER_CALIBRATE
    RESPOND PREFIX="SPARKSHIFT" MSG="Input shaper calibration complete. Run SAVE_CONFIG or copy frequencies into T0..T8."

[gcode_macro SPARKSHIFT_PA_TUNING_TOWER]
description: Configures Klipper TUNING_TOWER for calibrating Pressure Advance on the active tool
gcode:
    {% set start = params.START|default(0.0)|float %}
    {% set factor = params.FACTOR|default(0.002)|float %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START={start} FACTOR={factor}
    RESPOND PREFIX="SPARKSHIFT" MSG="Pressure Advance tuning tower active (START={start}, FACTOR={factor})."

