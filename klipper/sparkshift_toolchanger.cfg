# ==============================================================================
# SparkShift v26 HGX Quick-Change Hotend System — Klipper Configuration & Macros
# Target Printer: Voron 2.4R2 350mm + Monolith 2WD 9mm Gantry + BTT EBB42 CAN V1.2
# ==============================================================================
#
# ARCHITECTURAL OVERVIEW (SINGLE-DRIVE / MULTI-HOTEND HANDOVER):
# Unlike multi-extruder toolchangers, SparkShift keeps ONE LDO-36STH20-1004AHG
# motor and HGX steel hob drive on the carriage (P01..P09), while each parked
# toolhead (P17_3010 + P18_3010) retains its own hotend and loaded filament strand.
#
# Consequently, every toolchange executes a 5-stage physical sequence:
#   1. Anti-Ooze Melt-Zone Decompression & Tip Forming (_SPARKSHIFT_PRE_DROP):
#      - Retracts filament out of the pressurized 22 mm Volcano melt zone BEFORE
#        the servo cam opens the HGX hobs (once the hobs open, the filament strand
#        in the outgoing toolhead can no longer be retracted).
#      - Pulses a brief CPAP cooling burst to freeze the molten meniscus and drops
#        the outgoing toolhead to its non-oozing standby temperature (160 C).
#   2. Dock Entry, Silicone Ooze-Pad Sealing & Cam Release (_SPARKSHIFT_DROP_TOOL):
#      - Slides toolhead into P25_SparkShift_3010_Dock at (dock_x, dock_y_latched),
#        gliding the nozzle tip up the 15-deg ramp onto P25's spring-compliant
#        Silicone Ooze Stopper Pad (Z = -78.88 mm) to seal the 0.4 mm orifice.
#      - Rotates P05 Servo Cam to 175 deg (2.73 mm hob bite release gap), verifies
#        A1104 Hall sensor release on withdrawal, and parks the toolhead.
#   3. Tool Pickup & HGX Hob Filament Bite (_SPARKSHIFT_PICKUP_TOOL):
#      - Pre-ramps incoming toolhead T_new to print_temp while traveling.
#      - Enters T_new dock with cam open (175 deg), verifies A1104 Hall sensor
#        engagement, and rotates P05 Servo Cam to 0 deg so the spring-loaded HGX
#        hobs bite onto T_new's filament strand.
#      - Executes a +0.40 mm hob-seating micro-pulse before unlatching from P25.
#   4. Purge-Chute Prime & Dual-Blade Silicone Wiper Scrub (SPARKSHIFT_CLEAN_NOZZLE):
#      - Steps back 6.5 mm to Y_prime directly over P26_Dock_Nozzle_Wiper_and_Purge_Chute's
#        Purge Drop Window (Y_local = 16.20 mm), primes the Volcano melt zone,
#        and runs a multi-pass +/-X / -Y scrub across P26's dual V-notched silicone
#        wiper blades (Z_top = -78.88 mm) to shear the purge pellet down the 45-deg
#        chute into the catch basin.
#   5. Dynamic Per-Tool Parameter Restoration (_SPARKSHIFT_APPLY_TOOL_PARAMS):
#      - Restores per-tool Pressure Advance (PA + smooth_time), XYZ nozzle offsets
#        with Volcano thermal-expansion Z compensation, firmware retraction,
#        Input Shaper frequencies, and CPAP blower scaling.
# ==============================================================================

[mcu EBBCan]
# BTT EBB42 CAN V1.2 mounted vertically on P24_EBB42_Controller_Mount
canbus_uuid: 000000000000 # <-- Replace with your EBB42 UUID

# ------------------------------------------------------------------------------
# 1. Servo Cam Release (P05_Servo_cam: 0 deg = Locked, 175 deg = 2.73mm Open)
# ------------------------------------------------------------------------------
[servo sparkshift_cam]
pin: EBBCan:PB6
maximum_servo_angle: 180
minimum_pulse_width: 0.000500
maximum_pulse_width: 0.002500
initial_angle: 0

# ------------------------------------------------------------------------------
# 2. A1104 Hall-Effect Tool Presence Sensor (Triggered by 4x2mm Tool Disc Magnet)
# ------------------------------------------------------------------------------
[gcode_button sparkshift_tool_detect]
pin: ^!EBBCan:PB8
press_gcode:
    SET_GCODE_VARIABLE MACRO=_SPARKSHIFT_VARS VARIABLE=tool_detected VALUE=1
release_gcode:
    SET_GCODE_VARIABLE MACRO=_SPARKSHIFT_VARS VARIABLE=tool_detected VALUE=0

# ------------------------------------------------------------------------------
# 3. Trianglelab Supercharged 7040 CPAP Blower (24V, 67W, 46,000 RPM, 6.5 kPa)
# ------------------------------------------------------------------------------
[fan_generic cpap_blower]
pin: PD12 # Mainboard high-frequency PWM / 0-10V or PWM driver control pin
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.005
hardware_pwm: False
kick_start_time: 0.250
off_below: 0.12

# ------------------------------------------------------------------------------
# 4. Eddy-Current Probe & Input Shaping Accelerometer (P23 Shared Forward Mount)
# ------------------------------------------------------------------------------
[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_REPLACE_ME
x_offset: 0.0
y_offset: -19.50
# Coil sensing face sits at Z = -76.610 mm (2.269 mm above Z = -78.879 mm nozzle tip)
mesh_main_direction: x
mesh_runs: 2

[adxl345 ebb42]
cs_pin: EBBCan:PB12
spi_software_sclk_pin: EBBCan:PB10
spi_software_mosi_pin: EBBCan:PB11
spi_software_miso_pin: EBBCan:PB2
axes_map: -z, -y, -x

[resonance_tester]
accel_chip: beacon
probe_points: 175, 175, 20

[firmware_retraction]
retract_length: 0.65
retract_speed: 45
unretract_extra_length: 0.0
unretract_speed: 35

# ------------------------------------------------------------------------------
# 5. Global Toolchanger State & Geometry Variables
# ------------------------------------------------------------------------------
[gcode_macro _SPARKSHIFT_VARS]
description: Master kinematic, anti-ooze, wipe, and per-tool calibration registry
variable_active_tool: 0
variable_tool_detected: 1

# Voron 350 Front Dock Rack coordinates (9 bays @ 37.30 mm pitch centered at X=175.0,
# or 10 bays if X-travel >= 315 mm):
variable_dock_y_latched: 36.91     # Full dock engagement (nozzle sealed on P25 silicone pad)
variable_dock_y_prime: 43.41       # +6.50 mm back: nozzle centered over P26 Purge Drop Window
variable_dock_y_wipe: 48.91        # +12.00 mm back: nozzle centered in P26 Dual Silicone Wiper Blades
variable_dock_y_safe: 68.00        # Safe X-travel corridor clear of all parked 3010 fans & P26 chutes
variable_min_safe_z: 12.00         # Minimum Z height during dock movements

# Anti-ooze & Volcano melt-zone management:
variable_pre_drop_retract_mm: 5.00 # Decompresses 22mm Volcano melt zone before opening HGX hobs
variable_pickup_seat_mm: 0.40      # Micro-advance to seat HGX hob teeth into filament before unlatching
variable_prime_purge_mm: 5.40      # Repressurizes Volcano melt zone over P26 purge chute
variable_post_prime_retract: 0.70  # Prevents dribble between purge window and silicone wiper blades
variable_wipe_strokes: 3           # Number of +/-X scrub strokes across P26 silicone blades
variable_wipe_span_x: 6.50         # Half-stroke X scrub width (mm) inside P26 wiper slot
variable_servo_open_angle: 175     # P05 cam full-release angle (2.73 mm hob gap)
variable_servo_lock_angle: 0       # P05 cam locked extrusion angle
variable_servo_dwell_ms: 260       # Mechanical settle time for MG90D / P05 cam
variable_cpap_scale: 1.0           # Active tool CPAP blower scaling factor

# Thermal Z-expansion coefficient for Volcano hotend (mm per deg C above 220 C baseline):
variable_thermal_z_coeff: 0.00035

gcode:
    RESPOND PREFIX="SPARKSHIFT" MSG="Active Tool: T{active_tool} | Detected: {tool_detected}"

# ------------------------------------------------------------------------------
